        // Text-to-speech functionality
        function toggleSpeech(text, messageId, button, speed) {
            // Default to 1.0 if speed not provided
            speed = speed || getSpeechSpeed();
            // If we're already speaking this message, stop it
            if (currentSpeakingMessageId === messageId && currentSpeech) {
                window.speechSynthesis.cancel();
                currentSpeech = null;
                currentSpeakingMessageId = null;
                updateListenButton(button, false);
                return;
            }
            
            // If we're speaking a different message, stop it first
            if (currentSpeech && currentSpeakingMessageId !== messageId) {
                window.speechSynthesis.cancel();
                // Update the previous button
                const prevButton = document.querySelector(`[data-message-id="${currentSpeakingMessageId}"]`);
                if (prevButton) {
                    updateListenButton(prevButton, false);
                }
            }
            
            // Check if speech synthesis is supported
            if (!('speechSynthesis' in window)) {
                showStatus('Text-to-speech is not supported in this browser', 'error');
                return;
            }
            
            // Clean the text - remove markdown formatting and HTML tags
            let cleanText = text;
            
            // Remove markdown images
            cleanText = cleanText.replace(/!\[([^\]]*)\]\([^)]+\)/g, '');
            
            // Remove markdown formatting
            cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, '$1'); // Bold
            cleanText = cleanText.replace(/\*(.*?)\*/g, '$1'); // Italic
            cleanText = cleanText.replace(/`(.*?)`/g, '$1'); // Code
            cleanText = cleanText.replace(/#{1,6}\s+/g, ''); // Headers
            cleanText = cleanText.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'); // Links
            
            // Remove HTML tags if any
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = cleanText;
            cleanText = tempDiv.textContent || tempDiv.innerText || '';
            
            // Clean up extra whitespace
            cleanText = cleanText.replace(/\n+/g, '. ').replace(/\s+/g, ' ').trim();
            
            if (!cleanText) {
                showStatus('No text to read', 'error');
                return;
            }
            
            // Create speech utterance
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = speed; // Use provided speed
            utterance.pitch = 1.0; // Normal pitch
            utterance.volume = 1.0; // Full volume
            
            // Handle speech events
            utterance.onstart = function() {
                currentSpeech = utterance;
                currentSpeakingMessageId = messageId;
                updateListenButton(button, true);
            };
            
            utterance.onend = function() {
                currentSpeech = null;
                currentSpeakingMessageId = null;
                updateListenButton(button, false);
            };
            
            utterance.onerror = function(event) {
                console.error('Speech synthesis error:', event);
                showStatus('Error reading text: ' + (event.error || 'Unknown error'), 'error');
                currentSpeech = null;
                currentSpeakingMessageId = null;
                updateListenButton(button, false);
            };
            
            // Start speaking
            window.speechSynthesis.speak(utterance);
        }
        
        // Update listen button state
        function updateListenButton(button, isPlaying) {
            if (isPlaying) {
                button.classList.add('playing');
                button.textContent = '⏹ Stop';
            } else {
                button.classList.remove('playing');
                button.textContent = '🔊 Listen';
            }
        }
        
        // Get saved speech speed preference
        function getSpeechSpeed() {
            const saved = localStorage.getItem('blogDraftSpeechSpeed');
            return saved ? parseFloat(saved) : 1.5; // Default to 1.5
        }
        
        // Set speech speed preference
        function setSpeechSpeed(speed) {
            localStorage.setItem('blogDraftSpeechSpeed', speed.toString());
            // Update global selector to reflect change
            const globalSpeechSpeed = document.getElementById('globalSpeechSpeed');
            if (globalSpeechSpeed) {
                globalSpeechSpeed.value = speed.toString();
            }
        }
        
        // Copy message to clipboard
        function copyMessage(content, button) {
            // Clean the content - remove markdown formatting for plain text copy
            let textToCopy = content;
            
            // Remove markdown images
            textToCopy = textToCopy.replace(/!\[([^\]]*)\]\([^)]+\)/g, '');
            
            // Remove markdown formatting but keep text
            textToCopy = textToCopy.replace(/\*\*(.*?)\*\*/g, '$1'); // Bold
            textToCopy = textToCopy.replace(/\*(.*?)\*/g, '$1'); // Italic
            textToCopy = textToCopy.replace(/`(.*?)`/g, '$1'); // Code
            textToCopy = textToCopy.replace(/#{1,6}\s+/g, ''); // Headers
            textToCopy = textToCopy.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'); // Links
            
            // Remove HTML tags if any
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = textToCopy;
            textToCopy = tempDiv.textContent || tempDiv.innerText || textToCopy;
            
            // Clean up extra whitespace but preserve line breaks
            textToCopy = textToCopy.replace(/\n{3,}/g, '\n\n').trim();
            
            // Use modern Clipboard API if available
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy)
                    .then(function() {
                        // Show success feedback
                        const originalText = button.textContent;
                        button.classList.add('copied');
                        button.textContent = '✓ Copied!';
                        
                        // Reset after 2 seconds
                        setTimeout(function() {
                            button.classList.remove('copied');
                            button.textContent = originalText;
                        }, 2000);
                    })
                    .catch(function(err) {
                        console.error('Failed to copy:', err);
                        // Fallback to older method
                        fallbackCopyTextToClipboard(textToCopy, button);
                    });
            } else {
                // Fallback for older browsers
                fallbackCopyTextToClipboard(textToCopy, button);
            }
        }
        
        // Fallback copy method for older browsers
        function fallbackCopyTextToClipboard(text, button) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.width = '2em';
            textArea.style.height = '2em';
            textArea.style.padding = '0';
            textArea.style.border = 'none';
            textArea.style.outline = 'none';
            textArea.style.boxShadow = 'none';
            textArea.style.background = 'transparent';
            
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    // Show success feedback
                    const originalText = button.textContent;
                    button.classList.add('copied');
                    button.textContent = '✓ Copied!';
                    
                    // Reset after 2 seconds
                    setTimeout(function() {
                        button.classList.remove('copied');
                        button.textContent = originalText;
                    }, 2000);
                } else {
                    showStatus('Failed to copy to clipboard', 'error');
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showStatus('Failed to copy to clipboard', 'error');
            }
            
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
